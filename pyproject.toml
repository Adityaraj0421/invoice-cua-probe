[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-cua-probe"
version = "0.1.0"
description = "Local eval pack for hidden prompt injection in invoice PDFs and supplier emails."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "invoice-cua-probe contributors" }]
dependencies = [
  "google-genai>=2.7,<3",
  "pdfminer.six",
  "pillow",
  "playwright",
  "pypdfium2",
  "reportlab",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
probe = "invoice_cua_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
